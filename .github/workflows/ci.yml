on: [push, pull_request]
name: Continuous Integration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read # to analyse source files
      security-events: write # to report code quality inspections back via InspectCode / CodeQL
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # https://github.com/actions/setup-dotnet/releases/tag/v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@96fdc3456bf2908dd877213a2644ccb9e3010785 # https://github.com/JetBrains/ReSharper-InspectCode/releases/tag/v0.14
        with:
          build: true
          tool-version: '2026.2.1'
          solution: ./osu-server-beatmap-submission.sln
          caches-home: inspectcode
          verbosity: WARN

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # to compile and run tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # https://github.com/actions/setup-dotnet/releases/tag/v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Docker Compose
        run: docker compose up -d

      - name: Test
        run: dotnet test